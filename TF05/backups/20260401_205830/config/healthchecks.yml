healthchecks:
  web-frontend:
    type: http
    url: "http://frontend:80/"
    interval: 30s
    timeout: 10s
    retries: 2
    expected_status: 200
    expected_body: "Dashboard"
    
  api-backend:
    type: http
    url: "http://127.0.0.1:5000/health/status"
    interval: 15s
    timeout: 5s
    retries: 2
    expected_status: 200
    expected_body: "ok"
    headers:
      Authorization: "Bearer health-token"
    
  database:
    type: database
    connection: "mysql://user:pass@db:3306/app"
    query: "SELECT 1"
    interval: 60s
    timeout: 30s
    retries: 5
    
  redis-cache:
    type: tcp
    host: redis
    port: 6379
    interval: 30s
    timeout: 5s
    retries: 3
